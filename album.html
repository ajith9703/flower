<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>💖 Our Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #0d0015 0%, #1a0a2e 25%, #2d1b4e 50%, #1a0a2e 75%, #0d0015 100%);
    color: #ffe3f2;
    overflow-x: hidden;
  }

  /* ===================== LOCK SCREEN ===================== */
  .lock-screen {
    position: fixed; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    background: linear-gradient(135deg, #0d0015, #1a0a2e, #2d1b4e);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .lock-screen.unlocked {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
  }

  /* Floating particles on lock screen */
  .lock-particles {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .lock-particle {
    position: absolute;
    bottom: -20px;
    font-size: 18px;
    opacity: 0;
    animation: particleUp 8s ease-in-out infinite;
  }
  @keyframes particleUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .lock-icon {
    font-size: 56px;
    margin-bottom: 16px;
    animation: lockBounce 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,107,157,0.5));
  }
  @keyframes lockBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.05); }
  }

  .lock-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(22px, 6vw, 34px);
    background: linear-gradient(135deg, #ff9de0, #ff6b9d, #c44dff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradShift 4s ease-in-out infinite;
    margin-bottom: 8px;
  }
  @keyframes gradShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .lock-subtitle {
    font-size: 13px;
    color: rgba(255, 200, 230, 0.6);
    margin-bottom: 28px;
    letter-spacing: 0.04em;
  }

  /* PIN Display */
  .pin-display {
    display: flex;
    gap: 14px;
    margin-bottom: 8px;
  }
  .pin-dot {
    width: 48px; height: 56px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 107, 157, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #ff9de0;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }
  .pin-dot.filled {
    border-color: #ff6b9d;
    background: rgba(255, 107, 157, 0.15);
    box-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
    animation: dotPop 0.3s ease;
  }
  @keyframes dotPop {
    0% { transform: scale(0.8); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .pin-dot.filled::after {
    content: '💖';
    font-size: 20px;
  }
  .pin-dot.error {
    border-color: #ff4444;
    animation: shake 0.5s ease;
    background: rgba(255, 68, 68, 0.15);
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .pin-message {
    height: 24px;
    font-size: 12px;
    color: rgba(255, 107, 157, 0.7);
    margin-bottom: 20px;
    transition: all 0.3s ease;
  }
  .pin-message.error {
    color: #ff6b6b;
  }
  .pin-message.success {
    color: #6bffb3;
  }

  /* Cute Keyboard */
  .keyboard {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 20px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 340px;
    width: 90vw;
  }

  .keyboard-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    width: 100%;
  }

  .key {
    position: relative;
    min-width: 58px; height: 52px;
    border-radius: 14px;
    border: 1.5px solid rgba(255, 107, 157, 0.25);
    background: rgba(255, 255, 255, 0.06);
    color: #ffe3f2;
    font-family: 'Quicksand', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1px;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .key::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
    border-radius: 14px 14px 0 0;
    pointer-events: none;
  }
  .key:hover {
    border-color: rgba(255, 107, 157, 0.5);
    background: rgba(255, 107, 157, 0.12);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.2);
  }
  .key:active {
    transform: translateY(1px) scale(0.95);
    background: rgba(255, 107, 157, 0.2);
  }
  .key .letter-label {
    font-size: 10px;
    color: rgba(255, 200, 230, 0.4);
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  /* Letter keys */
  .alpha-row {
    flex-wrap: wrap;
    justify-content: center;
  }
  .key.alpha {
    min-width: 38px;
    height: 46px;
    border-radius: 12px;
    font-size: 15px;
    text-transform: uppercase;
  }
  .key.alpha.small { min-width: 34px; }

  /* Special keys */
  .key.backspace {
    background: rgba(255, 107, 157, 0.1);
    border-color: rgba(255, 107, 157, 0.35);
    min-width: 70px;
    font-size: 18px;
  }
  .key.backspace:hover {
    background: rgba(255, 107, 157, 0.2);
  }

  .key.space {
    min-width: 160px;
    font-size: 12px;
    color: rgba(255, 200, 230, 0.5);
    letter-spacing: 0.1em;
  }

  .key.enter-key {
    background: linear-gradient(135deg, rgba(255,107,157,0.25), rgba(196,77,255,0.2));
    border-color: rgba(255, 107, 157, 0.45);
    min-width: 70px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .key.enter-key:hover {
    background: linear-gradient(135deg, rgba(255,107,157,0.35), rgba(196,77,255,0.3));
    box-shadow: 0 6px 25px rgba(255, 107, 157, 0.3);
  }

  /* Key press ripple */
  .key-ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 107, 157, 0.4);
    transform: scale(0);
    animation: ripple 0.5s ease-out;
    pointer-events: none;
  }
  @keyframes ripple {
    to { transform: scale(3); opacity: 0; }
  }

  /* Caps indicator */
  .key.caps-active {
    background: rgba(255, 107, 157, 0.2);
    border-color: rgba(255, 107, 157, 0.5);
    box-shadow: 0 0 12px rgba(255, 107, 157, 0.3);
  }

  /* ===================== ALBUM ===================== */
  .album-container {
    display: none;
    min-height: 100vh;
    padding: calc(20px + env(safe-area-inset-top, 0)) 16px calc(20px + env(safe-area-inset-bottom, 0));
  }
  .album-container.visible {
    display: block;
    animation: albumFadeIn 0.8s ease;
  }
  @keyframes albumFadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .album-header {
    text-align: center;
    padding: 30px 0 24px;
  }
  .album-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(28px, 7vw, 42px);
    background: linear-gradient(135deg, #ff9de0, #ff6b9d, #c44dff, #9d6bff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradShift 4s ease-in-out infinite;
    margin-bottom: 6px;
  }
  .album-subtitle {
    font-size: 13px;
    color: rgba(255, 200, 230, 0.5);
    letter-spacing: 0.06em;
  }

  /* Back button */
  .back-btn {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0));
    left: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border: 1.5px solid rgba(255, 107, 157, 0.3);
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    color: #ff9de0;
    font-family: 'Quicksand', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
  }
  .back-btn:hover {
    background: rgba(255, 107, 157, 0.15);
    border-color: rgba(255, 107, 157, 0.5);
    transform: translateX(-3px);
  }

  /* Photo grid */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 4px 40px;
  }
  @media (max-width: 400px) {
    .photo-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
  }

  .photo-card {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: 18px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 107, 157, 0.15);
    cursor: pointer;
    transition: all 0.4s ease;
    animation: cardAppear 0.6s ease backwards;
  }
  .photo-card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: rgba(255, 107, 157, 0.4);
    box-shadow: 0 16px 40px rgba(255, 107, 157, 0.2);
  }
  .photo-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .photo-card:hover img {
    transform: scale(1.08);
  }
  .photo-card .card-number {
    position: absolute;
    top: 8px; right: 8px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: rgba(255, 200, 230, 0.8);
  }
  .photo-card .card-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 30px 10px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.6));
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .photo-card:hover .card-overlay {
    opacity: 1;
  }
  .card-overlay span {
    font-size: 11px;
    color: rgba(255, 230, 240, 0.9);
    font-weight: 500;
  }

  @keyframes cardAppear {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Placeholder for images */
  .photo-card.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
  }
  .photo-card.placeholder .placeholder-icon {
    font-size: 32px;
    opacity: 0.4;
  }
  .photo-card.placeholder .placeholder-text {
    font-size: 10px;
    color: rgba(255, 200, 230, 0.3);
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(20px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    animation: lbFadeIn 0.3s ease;
  }
  .lightbox.active {
    display: flex;
  }
  @keyframes lbFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .lightbox img {
    max-width: 92vw;
    max-height: 80vh;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    object-fit: contain;
    animation: lbZoom 0.4s ease;
  }
  @keyframes lbZoom {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .lightbox-close {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0));
    right: 16px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  .lightbox-close:hover {
    background: rgba(255, 107, 157, 0.3);
    border-color: rgba(255, 107, 157, 0.5);
  }
  .lightbox-nav {
    display: flex;
    gap: 16px;
  }
  .lightbox-nav button {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  .lightbox-nav button:hover {
    background: rgba(255, 107, 157, 0.3);
    border-color: rgba(255, 107, 157, 0.5);
  }
  .lightbox-counter {
    font-size: 12px;
    color: rgba(255, 200, 230, 0.6);
    letter-spacing: 0.1em;
  }

  /* Orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { width: 300px; height: 300px; background: #ff6b9d; top: -100px; left: -80px; animation: orbF 8s ease-in-out infinite alternate; }
  .orb2 { width: 250px; height: 250px; background: #c44dff; bottom: -80px; right: -60px; animation: orbF 10s ease-in-out infinite alternate-reverse; }
  /* Glowing footer credit: Made by Ayu */
  .made-by-ayu {
    text-align: center;
    padding: 30px 0 20px;
    white-space: nowrap;
    pointer-events: none;
  }
  .ayu-glow {
    font-family: 'Quicksand', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 8px rgba(255, 107, 157, 0.9),
      0 0 18px rgba(255, 61, 127, 0.8),
      0 0 30px rgba(196, 77, 255, 0.7);
    animation: ayuPulse 2.5s ease-in-out infinite alternate;
    display: inline-block;
  }
  @keyframes ayuPulse {
    0% { opacity: 0.85; transform: scale(0.98); }
    100% {
      opacity: 1;
      transform: scale(1.04);
      text-shadow:
        0 0 10px rgba(255, 107, 157, 1),
        0 0 24px rgba(255, 61, 127, 0.95),
        0 0 40px rgba(196, 77, 255, 0.85);
    }
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- ======= LOCK SCREEN ======= -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-particles" id="lockParticles"></div>
  <div class="lock-icon">🔒</div>
  <h2 class="lock-title">Private Album</h2>
  <p class="lock-subtitle">✨ Enter PIN to unlock ✨</p>

  <div class="pin-display" id="pinDisplay">
    <div class="pin-dot" id="dot0"></div>
    <div class="pin-dot" id="dot1"></div>
    <div class="pin-dot" id="dot2"></div>
    <div class="pin-dot" id="dot3"></div>
  </div>

  <div class="pin-message" id="pinMessage">type the secret word 💕</div>

  <!-- Cute Keyboard -->
  <div class="keyboard" id="keyboard">
    <!-- Row 1: Q-P -->
    <div class="keyboard-row alpha-row">
      <button class="key alpha" data-char="q">Q</button>
      <button class="key alpha" data-char="w">W</button>
      <button class="key alpha" data-char="e">E</button>
      <button class="key alpha" data-char="r">R</button>
      <button class="key alpha" data-char="t">T</button>
      <button class="key alpha" data-char="y">Y</button>
      <button class="key alpha" data-char="u">U</button>
      <button class="key alpha" data-char="i">I</button>
      <button class="key alpha" data-char="o">O</button>
      <button class="key alpha" data-char="p">P</button>
    </div>
    <!-- Row 2: A-L -->
    <div class="keyboard-row alpha-row">
      <button class="key alpha" data-char="a">A</button>
      <button class="key alpha" data-char="s">S</button>
      <button class="key alpha" data-char="d">D</button>
      <button class="key alpha" data-char="f">F</button>
      <button class="key alpha" data-char="g">G</button>
      <button class="key alpha" data-char="h">H</button>
      <button class="key alpha" data-char="j">J</button>
      <button class="key alpha" data-char="k">K</button>
      <button class="key alpha" data-char="l">L</button>
    </div>
    <!-- Row 3: Z-M + Backspace -->
    <div class="keyboard-row alpha-row">
      <button class="key alpha small" data-char="z">Z</button>
      <button class="key alpha small" data-char="x">X</button>
      <button class="key alpha small" data-char="c">C</button>
      <button class="key alpha small" data-char="v">V</button>
      <button class="key alpha small" data-char="b">B</button>
      <button class="key alpha small" data-char="n">N</button>
      <button class="key alpha small" data-char="m">M</button>
      <button class="key backspace" id="backspaceKey">⌫</button>
    </div>
    <!-- Row 4: Enter -->
    <div class="keyboard-row">
      <button class="key enter-key" id="enterKey">💖 UNLOCK</button>
    </div>
  </div>
</div>

<!-- ======= ALBUM ======= -->
<div class="album-container" id="albumContainer">
  <a href="flower.html" class="back-btn">← Back to Flower</a>

  <div class="album-header">
    <h1 class="album-title">💕 Images 💕</h1>
    <p class="album-subtitle">15 Images ✨</p>
  </div>

  <div class="photo-grid" id="photoGrid"></div>

  <div class="made-by-ayu">
    <span class="ayu-glow">✨ Made by Ayu ✨</span>
  </div>
</div>

<!-- ======= LIGHTBOX ======= -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">✕</button>
  <img id="lbImage" src="" alt="Photo">
  <div class="lightbox-counter" id="lbCounter"></div>
  <div class="lightbox-nav">
    <button id="lbPrev">❮</button>
    <button id="lbNext">❯</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ========== CONFIG ==========
  // PASSWORD (case-insensitive)
  const PASSWORD = "aaru";

  // 15 images from your desktop
  const IMAGES = [
    "images/Snapchat-1005823018.jpg",
    "images/Snapchat-1031469891.jpg",
    "images/Snapchat-1045981949.jpg",
    "images/Snapchat-1052412831.jpg",
    "images/Snapchat-116446507.jpg",
    "images/Snapchat-1248412750.jpg",
    "images/Snapchat-1263252004.jpg",
    "images/Snapchat-1566348384.jpg",
    "images/Snapchat-166788984.jpg",
    "images/Snapchat-1711437955.jpg",
    "images/Snapchat-1772163482.jpg",
    "images/Snapchat-1804379093.jpg",
    "images/Snapchat-190357768.jpg",
    "images/Snapchat-1926005060.jpg",
    "images/Snapchat-569059047.jpg"
  ];

  // ========== LOCK SCREEN ==========
  const lockScreen = document.getElementById('lockScreen');
  const pinDisplay = document.getElementById('pinDisplay');
  const pinMessage = document.getElementById('pinMessage');
  const albumContainer = document.getElementById('albumContainer');
  let enteredPin = "";

  // Generate lock screen particles
  const particleContainer = document.getElementById('lockParticles');
  const emojis = ['💕', '💖', '✨', '🌸', '💫', '🦋', '💜', '🌷', '💗', '🌙'];
  for(let i = 0; i < 15; i++){
    const p = document.createElement('div');
    p.className = 'lock-particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = (Math.random() * 100) + '%';
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.animationDuration = (6 + Math.random() * 4) + 's';
    particleContainer.appendChild(p);
  }

  function updatePinDots() {
    for(let i = 0; i < 4; i++){
      const dot = document.getElementById('dot' + i);
      if(i < enteredPin.length){
        dot.classList.add('filled');
        dot.classList.remove('error');
      } else {
        dot.classList.remove('filled');
        dot.classList.remove('error');
      }
    }
  }

  function showError() {
    pinMessage.textContent = "wrong password 😢 try again!";
    pinMessage.classList.add('error');
    pinMessage.classList.remove('success');
    for(let i = 0; i < 4; i++){
      document.getElementById('dot' + i).classList.add('error');
    }
    setTimeout(() => {
      enteredPin = "";
      updatePinDots();
      pinMessage.textContent = "type the secret word 💕";
      pinMessage.classList.remove('error');
    }, 1200);
  }

  function tryUnlock() {
    if(enteredPin.toLowerCase() === PASSWORD) {
      pinMessage.textContent = "unlocked! 💖✨";
      pinMessage.classList.add('success');
      pinMessage.classList.remove('error');

      // Change lock icon
      document.querySelector('.lock-icon').textContent = '🔓';

      setTimeout(() => {
        lockScreen.classList.add('unlocked');
        albumContainer.classList.add('visible');
        setTimeout(() => { lockScreen.style.display = 'none'; }, 600);
      }, 600);
    } else {
      showError();
    }
  }

  function addChar(ch) {
    if(enteredPin.length >= 4) return;
    enteredPin += ch;
    updatePinDots();

    if(enteredPin.length === 4) {
      setTimeout(tryUnlock, 300);
    }
  }

  function removeChar() {
    if(enteredPin.length === 0) return;
    enteredPin = enteredPin.slice(0, -1);
    updatePinDots();
  }

  // Keyboard click handlers
  document.querySelectorAll('.key[data-char]').forEach(key => {
    key.addEventListener('click', (e) => {
      e.preventDefault();
      // Ripple effect
      const ripple = document.createElement('span');
      ripple.className = 'key-ripple';
      const rect = key.getBoundingClientRect();
      ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
      ripple.style.left = '50%';
      ripple.style.top = '50%';
      ripple.style.marginLeft = -Math.max(rect.width, rect.height)/2 + 'px';
      ripple.style.marginTop = -Math.max(rect.width, rect.height)/2 + 'px';
      key.appendChild(ripple);
      setTimeout(() => ripple.remove(), 500);

      addChar(key.dataset.char);
    });
  });

  document.getElementById('backspaceKey').addEventListener('click', (e) => {
    e.preventDefault();
    removeChar();
  });

  document.getElementById('enterKey').addEventListener('click', (e) => {
    e.preventDefault();
    if(enteredPin.length > 0) tryUnlock();
  });

  // Physical keyboard support
  document.addEventListener('keydown', (e) => {
    if(lockScreen.style.display === 'none') return;
    if(e.key === 'Backspace') { removeChar(); return; }
    if(e.key === 'Enter') { if(enteredPin.length > 0) tryUnlock(); return; }
    if(/^[a-zA-Z]$/.test(e.key) && enteredPin.length < 4) {
      addChar(e.key.toLowerCase());
    }
  });

  // ========== ALBUM GRID ==========
  const photoGrid = document.getElementById('photoGrid');

  IMAGES.forEach((src, idx) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.style.animationDelay = (idx * 0.06) + 's';

    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Photo ' + (idx + 1);
    img.loading = 'lazy';
    img.onerror = function() {
      // If image not found, show placeholder
      card.classList.add('placeholder');
      card.innerHTML = `
        <div class="placeholder-icon">📷</div>
        <div class="placeholder-text">Photo ${idx + 1}</div>
      `;
    };

    const number = document.createElement('div');
    number.className = 'card-number';
    number.textContent = idx + 1;

    const overlay = document.createElement('div');
    overlay.className = 'card-overlay';
    overlay.innerHTML = `<span>💖 Photo ${idx + 1}</span>`;

    card.appendChild(img);
    card.appendChild(number);
    card.appendChild(overlay);

    card.addEventListener('click', () => openLightbox(idx));
    photoGrid.appendChild(card);
  });

  // ========== LIGHTBOX ==========
  let currentLbIndex = 0;
  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lbImage');
  const lbCounter = document.getElementById('lbCounter');

  function openLightbox(idx) {
    currentLbIndex = idx;
    lbImage.src = IMAGES[idx];
    lbCounter.textContent = (idx + 1) + ' / ' + IMAGES.length;
    lightbox.classList.add('active');
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if(e.target === lightbox) closeLightbox();
  });
  document.getElementById('lbPrev').addEventListener('click', () => {
    currentLbIndex = (currentLbIndex - 1 + IMAGES.length) % IMAGES.length;
    lbImage.src = IMAGES[currentLbIndex];
    lbCounter.textContent = (currentLbIndex + 1) + ' / ' + IMAGES.length;
  });
  document.getElementById('lbNext').addEventListener('click', () => {
    currentLbIndex = (currentLbIndex + 1) % IMAGES.length;
    lbImage.src = IMAGES[currentLbIndex];
    lbCounter.textContent = (currentLbIndex + 1) + ' / ' + IMAGES.length;
  });

  // Keyboard navigation in lightbox
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('active')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
    if(e.key === 'ArrowRight') document.getElementById('lbNext').click();
  });

})();
</script>
</body>
</html>
