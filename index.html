<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>💕 Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #0d0015 0%, #1a0a2e 25%, #2d1b4e 50%, #1a0a2e 75%, #0d0015 100%);
    position: relative;
  }

  /* Stars background */
  .stars {
    position: fixed; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.8), transparent),
      radial-gradient(2px 2px at 40px 70px, rgba(255,200,255,0.6), transparent),
      radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 130px 80px, rgba(200,180,255,0.7), transparent),
      radial-gradient(1px 1px at 160px 30px, rgba(255,255,255,0.4), transparent);
    background-size: 200px 100px;
    animation: twinkle 4s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes twinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* Floating hearts */
  .hearts-container {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .floating-heart {
    position: absolute;
    bottom: -60px;
    font-size: 24px;
    opacity: 0;
    animation: floatUp 6s ease-in-out infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
    10% { opacity: 0.8; }
    50% { opacity: 0.6; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
  }

  /* Glowing orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }
  .orb1 { width: 300px; height: 300px; background: #ff6b9d; top: -100px; left: -80px; animation: orbFloat 8s ease-in-out infinite alternate; }
  .orb2 { width: 250px; height: 250px; background: #c44dff; bottom: -80px; right: -60px; animation: orbFloat 10s ease-in-out infinite alternate-reverse; }
  .orb3 { width: 200px; height: 200px; background: #ff9de0; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: orbPulse 5s ease-in-out infinite; }
  @keyframes orbFloat {
    0% { transform: translate(0, 0); }
    100% { transform: translate(30px, -20px); }
  }
  @keyframes orbPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.5; }
  }

  /* Main container */
  .entrance-container {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  /* Envelope icon */
  .envelope {
    font-size: 64px;
    animation: envelopeBounce 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.6));
  }
  @keyframes envelopeBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.05); }
  }

  /* Title */
  .title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(28px, 7vw, 48px);
    background: linear-gradient(135deg, #ff9de0, #ff6b9d, #c44dff, #9d6bff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease-in-out infinite;
    text-shadow: none;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    font-size: clamp(13px, 3.5vw, 16px);
    color: rgba(255, 200, 230, 0.7);
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  /* Click Here Button */
  .click-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 48px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff6b9d, #ff3d7f, #e91e8c);
    color: #fff;
    font-family: 'Quicksand', sans-serif;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    overflow: hidden;
    box-shadow:
      0 8px 32px rgba(255, 61, 127, 0.4),
      0 0 60px rgba(255, 107, 157, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    animation: btnPulse 2.5s ease-in-out infinite;
    text-decoration: none;
  }
  .click-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .click-btn:hover::before { opacity: 1; }
  .click-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow:
      0 14px 42px rgba(255, 61, 127, 0.55),
      0 0 80px rgba(255, 107, 157, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .click-btn:active {
    transform: translateY(0) scale(0.98);
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(255, 61, 127, 0.4), 0 0 60px rgba(255, 107, 157, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
    50% { box-shadow: 0 8px 32px rgba(255, 61, 127, 0.6), 0 0 90px rgba(255, 107, 157, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
  }

  /* Shimmer on button */
  .click-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    50%, 100% { left: 150%; }
  }

  .click-btn span { position: relative; z-index: 1; }

  /* Sparkle particles around button */
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkleAnim 2s ease-in-out infinite;
  }
  @keyframes sparkleAnim {
    0%, 100% { transform: scale(0) rotate(0); opacity: 0; }
    50% { transform: scale(1) rotate(180deg); opacity: 1; }
  }

  /* Bottom glowing credit */
  .bottom-text {
    position: fixed;
    bottom: calc(16px + env(safe-area-inset-bottom, 0));
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-shadow:
      0 0 8px rgba(255, 107, 157, 0.9),
      0 0 18px rgba(255, 61, 127, 0.8),
      0 0 30px rgba(196, 77, 255, 0.7);
    animation: ayuPulse 2.5s ease-in-out infinite alternate;
    z-index: 10;
    white-space: nowrap;
    pointer-events: none;
  }
  @keyframes ayuPulse {
    0% { opacity: 0.85; transform: translateX(-50%) scale(0.98); }
    100% {
      opacity: 1;
      transform: translateX(-50%) scale(1.03);
      text-shadow:
        0 0 10px rgba(255, 107, 157, 1),
        0 0 24px rgba(255, 61, 127, 0.95),
        0 0 40px rgba(196, 77, 255, 0.85);
    }
  }

  /* Butterfly */
  .butterfly {
    position: fixed;
    font-size: 28px;
    animation: fly 12s ease-in-out infinite;
    z-index: 5;
    pointer-events: none;
  }
  @keyframes fly {
    0% { top: 30%; left: -5%; transform: rotate(-10deg) scaleX(1); }
    25% { top: 15%; left: 30%; transform: rotate(5deg) scaleX(-1); }
    50% { top: 40%; left: 65%; transform: rotate(-5deg) scaleX(1); }
    75% { top: 20%; left: 85%; transform: rotate(10deg) scaleX(-1); }
    100% { top: 30%; left: 105%; transform: rotate(-10deg) scaleX(1); }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="hearts-container" id="heartsContainer"></div>
<div class="butterfly">🦋</div>

<div class="entrance-container">
  <div class="envelope">💌</div>
  <h1 class="title">Something Special For You</h1>
  <p class="subtitle">✨ A little surprise awaits ✨</p>
  <a href="flower.html" class="click-btn" id="clickBtn">
    <span>💗 Click Here 💗</span>
  </a>
</div>

<div class="bottom-text">✨ Made by Ayu ✨</div>

<script>
(function(){
  // Generate floating hearts
  const container = document.getElementById('heartsContainer');
  const heartEmojis = ['💕', '💖', '💗', '💝', '🌸', '✨', '💫', '🦋', '🌷', '💜'];
  for(let i = 0; i < 20; i++){
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    heart.style.left = (Math.random() * 100) + '%';
    heart.style.fontSize = (16 + Math.random() * 20) + 'px';
    heart.style.animationDelay = (Math.random() * 6) + 's';
    heart.style.animationDuration = (5 + Math.random() * 4) + 's';
    container.appendChild(heart);
  }

  // Add sparkles around button
  const btn = document.getElementById('clickBtn');
  for(let i = 0; i < 6; i++){
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    const angle = (i / 6) * Math.PI * 2;
    const radius = 70 + Math.random() * 20;
    sparkle.style.left = (50 + Math.cos(angle) * radius) + '%';
    sparkle.style.top = (50 + Math.sin(angle) * radius) + '%';
    sparkle.style.animationDelay = (i * 0.3) + 's';
    sparkle.style.width = (4 + Math.random() * 4) + 'px';
    sparkle.style.height = sparkle.style.width;
    btn.parentElement.style.position = 'relative';
    btn.parentElement.appendChild(sparkle);
  }
})();
</script>
</body>
</html>
