<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Realistic Pink Peony</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { min-height: 100vh; overflow: hidden; }

  body {
    background: radial-gradient(circle at 30% 15%, #ffe6f2 0%, #ffc4dd 35%, #ff9ec4 70%, #ff87b8 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 1.5s ease;
    position: relative;
  }

  body::before {
    content: ""; position: fixed; inset: 0;
    background:
      radial-gradient(circle at 75% 80%, rgba(255, 235, 248, 0.6), transparent 60%),
      radial-gradient(circle at 15% 85%, rgba(255, 220, 240, 0.55), transparent 55%);
    pointer-events: none; z-index: 1;
  }

  body.bloomed {
    background: radial-gradient(circle at 30% 15%, #ffd6ea 0%, #ffaad0 35%, #ff7fb5 70%, #ff5fa0 100%);
  }

  #canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 3;
  }

  .flower-stage {
    position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100vh;
  }

  .flower {
    height: min(94vh, 760px);
    width: calc(min(94vh, 760px) * 400 / 720);
    pointer-events: auto; cursor: pointer;
    transition: filter 1.5s ease;
    transform-origin: center bottom;
    position: relative;
    filter: drop-shadow(0 20px 32px rgba(180, 70, 120, 0.28));
  }

  .flower.full {
    filter: drop-shadow(0 0 50px rgba(255, 150, 200, 0.95))
            drop-shadow(0 0 100px rgba(255, 130, 180, 0.7))
            drop-shadow(0 25px 45px rgba(180, 70, 120, 0.45));
    animation: sway 6s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: translateY(0) rotate(-0.7deg); }
    50%      { transform: translateY(-9px) rotate(0.7deg); }
  }

  .flower-svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* STEM */
  .stem-path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    transition: stroke-dashoffset 4.2s cubic-bezier(0.55, 0, 0.45, 1);
  }
  .flower.stem .stem-path { stroke-dashoffset: 0; }

  .stem-highlight {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    transition: stroke-dashoffset 4.2s cubic-bezier(0.55, 0, 0.45, 1) 0.2s;
  }
  .flower.stem .stem-highlight { stroke-dashoffset: 0; }

  /* LEAVES */
  .leaf-inner {
    transform: scale(0);
    transform-origin: 0% 50%;
    transform-box: fill-box;
    transition: transform 1.5s cubic-bezier(0.34, 1.5, 0.55, 1);
    transition-delay: var(--ld, 0s);
  }
  .flower.leaf .leaf-inner { transform: scale(1); }

  /* FLOWER HEAD */
  .flower-head {
    transform: scale(0);
    transform-origin: 50% 50%;
    transform-box: fill-box;
    opacity: 0;
    transition: transform 2.4s cubic-bezier(0.34, 1.4, 0.5, 1),
                opacity 1.4s ease;
  }
  .flower.head .flower-head { transform: scale(1); opacity: 1; }

  /* PETALS */
  .petal {
    transform: scale(0);
    transform-origin: 50% 100%;
    transform-box: fill-box;
    opacity: 0;
    transition: transform 2.2s cubic-bezier(0.34, 1.5, 0.55, 1),
                opacity 1.2s ease;
    transition-delay: var(--d, 0s);
    will-change: transform;
  }
  .flower.bloom .petal { transform: scale(1); opacity: 1; }

  /* STAMENS */
  .stamen {
    transform: scale(0);
    transform-origin: 50% 100%;
    transform-box: fill-box;
    opacity: 0;
    transition: transform 1.4s cubic-bezier(0.34, 1.6, 0.5, 1),
                opacity 0.9s ease;
    transition-delay: var(--sd, 0s);
  }
  .flower.bloom .stamen { transform: scale(1); opacity: 1; }

  .center-core {
    transform: scale(0);
    transform-origin: 50% 50%;
    transform-box: fill-box;
    opacity: 0;
    transition: transform 1.6s cubic-bezier(0.34, 1.5, 0.55, 1),
                opacity 1.1s ease;
    transition-delay: 4.6s;
  }
  .flower.bloom .center-core { transform: scale(1); opacity: 1; }

  /* GLOW */
  .bloom-glow {
    position: absolute; top: 3%; left: 50%;
    transform: translateX(-50%) scale(0.6);
    width: 62%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 220, 240, 0.98) 0%,
      rgba(255, 160, 205, 0.6) 40%,
      rgba(255, 120, 180, 0) 72%);
    opacity: 0;
    transition: opacity 1.8s ease, transform 2s cubic-bezier(0.34, 1.5, 0.55, 1);
    pointer-events: none; z-index: -1; filter: blur(16px);
  }
  .flower.bloom .bloom-glow {
    opacity: 1; transform: translateX(-50%) scale(1.7);
    animation: glow-pulse 3.2s ease-in-out infinite alternate;
  }
  @keyframes glow-pulse {
    0%   { transform: translateX(-50%) scale(1.5); opacity: 0.85; }
    100% { transform: translateX(-50%) scale(1.9); opacity: 1; }
  }

  /* HINT */
  .hint {
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%);
    color: #8b2b53; font-size: 0.82rem; letter-spacing: 3px;
    text-transform: uppercase; padding: 12px 30px;
    background: rgba(255, 245, 250, 0.8);
    backdrop-filter: blur(10px);
    border-radius: 40px;
    box-shadow: 0 8px 24px rgba(255, 130, 180, 0.35);
    pointer-events: none; z-index: 10; font-weight: 500;
    transition: opacity 0.8s ease, transform 0.8s ease;
    animation: hint-bob 3s ease-in-out infinite;
  }
  @keyframes hint-bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-6px); }
  }
  body.bloomed .hint { opacity: 0; transform: translateX(-50%) translateY(20px); }

  @media (max-width: 500px) {
    .hint { font-size: 0.68rem; padding: 10px 20px; letter-spacing: 2px; bottom: 18px; }
  }

  /* Album corner wrapper & pointing arrow */
  .album-corner-wrapper {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .arrow-pointer {
    display: flex;
    align-items: center;
    cursor: pointer;
    text-decoration: none;
    filter: drop-shadow(0 3px 12px rgba(255, 59, 0, 0.9));
    transition: filter 0.2s ease, transform 0.2s ease;
    animation: arrowPointNudge 1.1s ease-in-out infinite;
  }
  .arrow-pointer:hover {
    filter: drop-shadow(0 5px 20px rgba(255, 59, 0, 1)) brightness(1.2);
  }
  .curved-arrow-svg {
    width: 64px;
    height: 40px;
    overflow: visible;
    display: block;
  }

  @keyframes arrowPointNudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(9px); }
  }

  .album-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 11px 22px;
    border-radius: 50px;
    background: rgba(255, 255, 255, 0.88);
    border: 1.5px solid rgba(255, 140, 180, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 8px 24px rgba(200, 50, 100, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    color: #6b0a2e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
    animation: albumPulse 2.5s ease-in-out infinite;
  }
  .album-btn:hover {
    border-color: #ff2a6d;
    transform: translateY(-2px) scale(1.05);
    box-shadow:
      0 12px 30px rgba(255, 42, 109, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }
  @keyframes albumPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(200, 50, 100, 0.25); }
    50% { box-shadow: 0 8px 24px rgba(200, 50, 100, 0.4), 0 0 20px rgba(255, 105, 180, 0.5); }
  }
  .album-btn .album-emoji {
    font-size: 16px;
    animation: heartBeat 1.5s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.2); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  /* Glowing footer credit: Made by Ayu */
  .made-by-ayu {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }
  .ayu-glow {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 0 8px rgba(255, 42, 109, 0.9),
      0 0 16px rgba(255, 42, 109, 0.8),
      0 0 28px rgba(255, 105, 180, 0.7),
      0 0 40px rgba(255, 0, 128, 0.5);
    animation: ayuGlow 2.5s ease-in-out infinite alternate;
    display: inline-block;
  }
  @keyframes ayuGlow {
    0% {
      text-shadow:
        0 0 6px rgba(255, 42, 109, 0.8),
        0 0 12px rgba(255, 42, 109, 0.6),
        0 0 20px rgba(255, 105, 180, 0.5);
      opacity: 0.85;
      transform: scale(0.98);
    }
    100% {
      text-shadow:
        0 0 10px rgba(255, 42, 109, 1),
        0 0 20px rgba(255, 42, 109, 0.9),
        0 0 35px rgba(255, 105, 180, 0.8),
        0 0 50px rgba(255, 0, 128, 0.6);
      opacity: 1;
      transform: scale(1.04);
    }
  }

  @media (max-width: 500px) {
    .album-corner-wrapper { right: 12px; top: 14px; gap: 6px; }
    .curved-arrow-svg { width: 48px; height: 32px; }
    .album-btn { padding: 9px 16px; font-size: 11.5px; }
    .ayu-glow { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="album-corner-wrapper" onclick="event.stopPropagation()">
  <!-- Curved pointer arrow pointing directly into Album button -->
  <a href="album.html" class="arrow-pointer" title="Open Album" aria-label="Open Album">
    <svg viewBox="0 0 100 60" class="curved-arrow-svg">
      <defs>
        <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ff4400" />
          <stop offset="60%" stop-color="#ff1254" />
          <stop offset="100%" stop-color="#ff0048" />
        </linearGradient>
      </defs>
      <!-- Reference image curved swooping arrow: swoops from top-left, arches, sharp tip points directly into the Album button -->
      <path d="M 6 8 C 45 4, 76 12, 78 30 L 72 23 L 98 33 L 78 47 L 78 39 C 68 23, 40 18, 6 22 Z" fill="url(#arrowGrad)" />
    </svg>
  </a>

  <!-- Album Button -->
  <a href="album.html" class="album-btn">
    <span class="album-emoji">💕</span>
    <span>Album</span>
  </a>
</div>
<canvas id="canvas"></canvas>

<div class="flower-stage">
  <div class="flower" id="flower">
    <div class="bloom-glow"></div>

    <svg class="flower-svg" viewBox="0 0 400 720" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- ═══════════ REALISTIC PETAL GRADIENTS (dark base → light tip) ═══════════ -->
        <radialGradient id="pOuter" cx="50%" cy="102%" r="112%" fx="50%" fy="98%">
          <stop offset="0%"   stop-color="#6b0a2e"/>
          <stop offset="18%"  stop-color="#a81848"/>
          <stop offset="38%"  stop-color="#d94477"/>
          <stop offset="58%"  stop-color="#f478a2"/>
          <stop offset="76%"  stop-color="#ffa8c4"/>
          <stop offset="90%"  stop-color="#ffd4e0"/>
          <stop offset="100%" stop-color="#fff0f5"/>
        </radialGradient>

        <radialGradient id="pMid" cx="50%" cy="102%" r="112%" fx="50%" fy="98%">
          <stop offset="0%"   stop-color="#4a051e"/>
          <stop offset="20%"  stop-color="#87153a"/>
          <stop offset="45%"  stop-color="#c43868"/>
          <stop offset="68%"  stop-color="#ef6e98"/>
          <stop offset="85%"  stop-color="#ffb0c8"/>
          <stop offset="100%" stop-color="#ffe6ee"/>
        </radialGradient>

        <radialGradient id="pInner" cx="50%" cy="102%" r="112%" fx="50%" fy="98%">
          <stop offset="0%"   stop-color="#320014"/>
          <stop offset="25%"  stop-color="#6a0a2e"/>
          <stop offset="55%"  stop-color="#a82055"/>
          <stop offset="78%"  stop-color="#e05488"/>
          <stop offset="100%" stop-color="#ffa0bc"/>
        </radialGradient>

        <radialGradient id="pDeep" cx="50%" cy="102%" r="112%" fx="50%" fy="98%">
          <stop offset="0%"   stop-color="#24000d"/>
          <stop offset="30%"  stop-color="#540424"/>
          <stop offset="60%"  stop-color="#8a1844"/>
          <stop offset="85%"  stop-color="#c04475"/>
          <stop offset="100%" stop-color="#f080a0"/>
        </radialGradient>

        <!-- Base inner shadow (attachment point) -->
        <radialGradient id="pBaseShadow" cx="50%" cy="100%" r="65%">
          <stop offset="0%"   stop-color="rgba(30,0,12,0.9)"/>
          <stop offset="35%"  stop-color="rgba(50,0,20,0.5)"/>
          <stop offset="70%"  stop-color="rgba(60,0,25,0.15)"/>
          <stop offset="100%" stop-color="rgba(60,0,25,0)"/>
        </radialGradient>

        <!-- Specular top highlight -->
        <radialGradient id="pTopShine" cx="50%" cy="10%" r="42%">
          <stop offset="0%"   stop-color="rgba(255,245,250,0.75)"/>
          <stop offset="55%"  stop-color="rgba(255,225,240,0.22)"/>
          <stop offset="100%" stop-color="rgba(255,225,240,0)"/>
        </radialGradient>

        <!-- Edge rim light -->
        <linearGradient id="pRimLight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="rgba(255,240,248,0.65)"/>
          <stop offset="30%"  stop-color="rgba(255,240,248,0.15)"/>
          <stop offset="100%" stop-color="rgba(255,240,248,0)"/>
        </linearGradient>

        <!-- ═══════════ STEM ═══════════ -->
        <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#234a1a"/>
          <stop offset="40%"  stop-color="#4f9038"/>
          <stop offset="75%"  stop-color="#3e7a2b"/>
          <stop offset="100%" stop-color="#1e3e15"/>
        </linearGradient>

        <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#245018"/>
          <stop offset="40%"  stop-color="#4d9030"/>
          <stop offset="78%"  stop-color="#84cc58"/>
          <stop offset="100%" stop-color="#c0e898"/>
        </linearGradient>

        <!-- ═══════════ STAMENS (yellow) ═══════════ -->
        <radialGradient id="antherG" cx="38%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#fffbd8"/>
          <stop offset="30%"  stop-color="#ffe466"/>
          <stop offset="70%"  stop-color="#ffc020"/>
          <stop offset="100%" stop-color="#d49000"/>
        </radialGradient>
        <radialGradient id="antherG2" cx="38%" cy="32%" r="68%">
          <stop offset="0%"   stop-color="#fff4b0"/>
          <stop offset="35%"  stop-color="#ffd740"/>
          <stop offset="75%"  stop-color="#f0a800"/>
          <stop offset="100%" stop-color="#b87800"/>
        </radialGradient>
        <linearGradient id="filamentG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#f5d868"/>
          <stop offset="60%"  stop-color="#d4a830"/>
          <stop offset="100%" stop-color="#8a6818"/>
        </linearGradient>
        <radialGradient id="pollenG" cx="45%" cy="40%" r="60%">
          <stop offset="0%"   stop-color="#fffce0"/>
          <stop offset="45%"  stop-color="#ffe866"/>
          <stop offset="100%" stop-color="#cc9c00"/>
        </radialGradient>
        <radialGradient id="centerCoreG" cx="45%" cy="40%" r="65%">
          <stop offset="0%"   stop-color="#fff8c8"/>
          <stop offset="35%"  stop-color="#ffd84a"/>
          <stop offset="75%"  stop-color="#d89818"/>
          <stop offset="100%" stop-color="#8a5c08"/>
        </radialGradient>

        <!-- ═══════════ FILTERS ═══════════ -->
        <!-- Organic ruffle on petal edges -->
        <filter id="ruffle" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035 0.06" numOctaves="3" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <filter id="ruffle2" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.045 0.07" numOctaves="3" seed="13" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>

        <!-- Soft drop shadow per petal -->
        <filter id="petalDrop" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
          <feOffset dx="0" dy="3"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.55"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Soft edge shadow for leaves -->
        <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
          <feOffset dx="0" dy="2.5"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.32"/></feComponentTransfer>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <!-- Overall petal softness -->
        <filter id="petalSoft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.4"/>
        </filter>

        <!-- ═══════════ PETAL GEOMETRY ═══════════ -->
        <path id="petalPath" d="M 0 0
          C -28 -18, -58 -55, -68 -108
          C -75 -148, -60 -186, -34 -204
          C -16 -216, 14 -218, 32 -206
          C 60 -188, 75 -150, 68 -108
          C 58 -55, 28 -18, 0 0 Z"/>

        <!-- Small petal for inner layers -->
        <path id="petalPathS" d="M 0 0
          C -24 -15, -50 -48, -58 -95
          C -64 -130, -50 -164, -28 -180
          C -13 -190, 12 -192, 27 -181
          C 50 -164, 63 -130, 58 -95
          C 50 -48, 24 -15, 0 0 Z"/>

        <!-- Leaf shape -->
        <g id="leafShape">
          <path d="M 0 0 C 30 -30, 80 -38, 118 0 C 80 38, 30 30, 0 0 Z"
                fill="url(#leafG)" stroke="#1e4010" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M 8 0 Q 62 -3 110 0" stroke="#e0f5c8" stroke-width="1.8" fill="none" opacity="0.75" stroke-linecap="round"/>
          <path d="M 28 -2 L 40 -18 M 52 -3 L 66 -18 M 76 -3 L 92 -14 M 28 2 L 40 18 M 52 3 L 66 18 M 76 3 L 92 14"
                stroke="#e0f5c8" stroke-width="0.9" fill="none" opacity="0.55" stroke-linecap="round"/>
        </g>

        <!-- ═══════════ FULL PETAL SYMBOLS (each with gradient + shadow + shine + veins) ═══════════ -->
        
        <!-- OUTER petal (large, light pink) -->
        <g id="realPetalOuter">
          <!-- drop shadow -->
          <use href="#petalPath" fill="rgba(70,8,35,0.5)" filter="url(#petalDrop)"/>
          <!-- main body with ruffle edge -->
          <use href="#petalPath" fill="url(#pOuter)" filter="url(#ruffle)"/>
          <!-- inner base shadow -->
          <use href="#petalPath" fill="url(#pBaseShadow)"/>
          <!-- top specular shine -->
          <use href="#petalPath" fill="url(#pTopShine)"/>
          <!-- rim light on one edge -->
          <path d="M 0 0 C -28 -18, -58 -55, -68 -108 C -75 -148, -60 -186, -34 -204
                   C -30 -208, -22 -212, -14 -214"
                fill="none" stroke="url(#pRimLight)" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
          <!-- veins -->
          <g stroke="rgba(255,235,245,0.22)" stroke-width="0.9" fill="none" stroke-linecap="round">
            <path d="M 0 -12 Q 3 -70 -2 -155"/>
            <path d="M 0 -12 Q -18 -80 -34 -145"/>
            <path d="M 0 -12 Q 18 -80 34 -145"/>
            <path d="M 0 -12 Q -30 -88 -55 -138"/>
            <path d="M 0 -12 Q 30 -88 55 -138"/>
          </g>
          <!-- center subtle sheen -->
          <path d="M -12 -120 Q 0 -160 12 -120 Q 0 -100 -12 -120 Z"
                fill="rgba(255,255,255,0.18)" opacity="0.6"/>
        </g>

        <!-- MID petal (medium, hot pink) -->
        <g id="realPetalMid">
          <use href="#petalPath" fill="rgba(60,5,28,0.55)" filter="url(#petalDrop)"/>
          <use href="#petalPath" fill="url(#pMid)" filter="url(#ruffle2)"/>
          <use href="#petalPath" fill="url(#pBaseShadow)"/>
          <use href="#petalPath" fill="url(#pTopShine)"/>
          <path d="M 0 0 C -28 -18, -58 -55, -68 -108 C -75 -148, -60 -186, -34 -204
                   C -30 -208, -22 -212, -14 -214"
                fill="none" stroke="url(#pRimLight)" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
          <g stroke="rgba(255,225,240,0.18)" stroke-width="0.8" fill="none" stroke-linecap="round">
            <path d="M 0 -10 Q 3 -65 -2 -145"/>
            <path d="M 0 -10 Q -20 -75 -36 -140"/>
            <path d="M 0 -10 Q 20 -75 36 -140"/>
          </g>
        </g>

        <!-- INNER petal (small, deep pink) -->
        <g id="realPetalInner">
          <use href="#petalPathS" fill="rgba(40,2,18,0.6)" filter="url(#petalDrop)"/>
          <use href="#petalPathS" fill="url(#pInner)" filter="url(#ruffle)"/>
          <use href="#petalPathS" fill="url(#pBaseShadow)"/>
          <use href="#petalPathS" fill="url(#pTopShine)"/>

<div class="hint">click anywhere to bloom</div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var flower = document.getElementById('flower');
  var body = document.body;

  var W, H, particles = [], bursts = [], time = 0;
  var AMBIENT = 340;

  var COLORS = [
    'rgba(255, 220, 235, 1)','rgba(255, 190, 215, 1)','rgba(255, 240, 245, 1)',
    'rgba(255, 215, 245, 1)','rgba(255, 232, 210, 1)','rgba(255, 200, 220, 1)',
    'rgba(255, 245, 250, 1)','rgba(255, 180, 210, 1)','rgba(255, 165, 200, 1)',
    'rgba(255, 205, 225, 1)','rgba(255, 240, 220, 1)',
    'rgba(255, 230, 130, 1)','rgba(255, 220, 100, 1)','rgba(255, 240, 160, 1)'
  ];

  function rand(a, b) { return Math.random() * (b - a) + a; }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function createParticle(fromBottom) {
    var t = Math.random(), kind = 'circle';
    if (t > 0.93) kind = 'heart';
    else if (t > 0.80) kind = 'star';
    else if (t > 0.66) kind = 'petal';
    else if (t > 0.54) kind = 'ring';

    return {
      x: rand(-30, W + 30),
      y: fromBottom ? H + rand(10, 100) : rand(-40, H),
      size: rand(2.5, 8.5),
      vx: rand(-0.45, 0.45),
      vy: fromBottom ? rand(-1.7, -0.6) : rand(-1.0, -0.28),
      color: COLORS[(Math.random() * COLORS.length) | 0],
      rotation: rand(0, Math.PI * 2),
      rotSpeed: rand(-0.028, 0.028),
      opacity: rand(0.55, 1),
      kind: kind,
      wobble: rand(0, Math.PI * 2),
      wobbleSpeed: rand(0.012, 0.032),
      wobbleAmp: rand(0.15, 0.45),
      pulse: rand(0, Math.PI * 2),
      pulseSpeed: rand(0.02, 0.055)
    };
  }

  for (var i = 0; i < AMBIENT; i++) particles.push(createParticle(false));

  function createBurst(x, y, count) {
    for (var i = 0; i < count; i++) {
      var angle = rand(0, Math.PI * 2), speed = rand(2.5, 11);
      var t = Math.random(), kind = 'circle';
      if (t > 0.6) kind = 'heart';
      else if (t > 0.25) kind = 'star';
      else if (t > 0.1) kind = 'petal';

      bursts.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.3,
        size: rand(3, 11),
        color: COLORS[(Math.random() * COLORS.length) | 0],
        rotation: rand(0, Math.PI * 2),
        rotSpeed: rand(-0.28, 0.28),
        life: 1, decay: rand(0.008, 0.018),
        gravity: 0.10, kind: kind, drag: 0.985
      });
    }
  }

  function drawHeart(x, y, size, color, rotation, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    var s = size;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s * 0.75, -s * 0.45, -s * 1.15, s * 0.35, 0, s * 1.05);
    ctx.bezierCurveTo(s * 1.15, s * 0.35, s * 0.75, -s * 0.45, 0, s * 0.35);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-s * 0.32, -s * 0.2, s * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
    ctx.restore();
  }

  function drawStar(x, y, size, color, rotation, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 5; i++) {
      var oa = (Math.PI * 2 / 5) * i - Math.PI / 2;
      var ia = oa + Math.PI / 5;
      var ox = Math.cos(oa) * size, oy = Math.sin(oa) * size;
      var ix = Math.cos(ia) * size * 0.45, iy = Math.sin(ia) * size * 0.45;
      if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function drawPetalSmall(x, y, size, color, rotation, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
    ctx.globalAlpha = alpha; ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.bezierCurveTo(size * 0.9, -size * 0.55, size * 0.9, size * 0.55, 0, size);
    ctx.bezierCurveTo(-size * 0.9, size * 0.55, -size * 0.9, -size * 0.55, 0, -size);
    ctx.fill(); ctx.restore();
  }

  function drawRing(x, y, size, color, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
    ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, size * 0.35);
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawCircleGlow(x, y, size, color, alpha) {
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
    var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2);
    grad.addColorStop(0, color);
    grad.addColorStop(0.45, color.replace(/[\d.]+\)$/, '0.45)'));
    grad.addColorStop(1, 'rgba(255,200,220,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, size * 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawParticle(p) {
    var pulse = 1 + Math.sin(p.pulse) * 0.18;
    var s = p.size * pulse;
    if (p.kind === 'heart') drawHeart(p.x, p.y, s, p.color, p.rotation, p.opacity);
    else if (p.kind === 'star') drawStar(p.x, p.y, s, p.color, p.rotation, p.opacity);
    else if (p.kind === 'petal') drawPetalSmall(p.x, p.y, s * 1.4, p.color, p.rotation, p.opacity * 0.9);
    else if (p.kind === 'ring') drawRing(p.x, p.y, s * 1.2, p.color, p.opacity * 0.7);
    else drawCircleGlow(p.x, p.y, s, p.color, p.opacity);
  }

  function drawBurst(b) {
    if (b.kind === 'heart') drawHeart(b.x, b.y, b.size, b.color, b.rotation, b.life);
    else if (b.kind === 'star') drawStar(b.x, b.y, b.size, b.color, b.rotation, b.life);
    else if (b.kind === 'petal') drawPetalSmall(b.x, b.y, b.size * 1.2, b.color, b.rotation, b.life);
    else drawCircleGlow(b.x, b.y, b.size, b.color, b.life);
  }

  function update() {
    var i, p, b;
    for (i = particles.length - 1; i >= 0; i--) {
      p = particles[i];
      p.wobble += p.wobbleSpeed;
      p.pulse += p.pulseSpeed;
      p.x += p.vx + Math.sin(p.wobble) * p.wobbleAmp;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      if (p.y < -80 || p.x < -80 || p.x > W + 80) particles[i] = createParticle(true);
    }
    for (i = bursts.length - 1; i >= 0; i--) {
      b = bursts[i];
      b.x += b.vx; b.y += b.vy;
      b.vy += b.gravity;
      b.vx *= b.drag; b.vy *= b.drag;
      b.rotation += b.rotSpeed;
      b.life -= b.decay;
      if (b.life <= 0 || b.y > H + 90) bursts.splice(i, 1);
    }
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    time++;
    for (var i = 0; i < particles.length; i++) drawParticle(particles[i]);
    for (var j = 0; j < bursts.length; j++) drawBurst(bursts[j]);
    update();
    requestAnimationFrame(animate);
  }
  animate();

  function headCenter() {
    var rect = flower.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height * (240 / 720)
    };
  }
  function baseCenter() {
    var rect = flower.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.bottom - 25 };
  }

  var timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function bloom() {
    clearTimers();
    flower.classList.remove('stem', 'leaf', 'head', 'bloom', 'full');
    body.classList.remove('bloomed');
    void flower.offsetWidth;

    // ═══════════════════════════════════════════════════
    // FULL GROWTH TIMELINE  (≈ 22s to complete)
    // ═══════════════════════════════════════════════════

    // STEP 1: STEM
    timers.push(setTimeout(function () {
      flower.classList.add('stem');
      var b = baseCenter();
      createBurst(b.x, b.y, 20);
    }, 80));

    // STEP 2: LEAVES
    timers.push(setTimeout(function () {
      flower.classList.add('leaf');
      var c = flower.getBoundingClientRect();
      createBurst(c.left + c.width * 0.72, c.top + c.height * (380/720), 12);
    }, 4400));
    timers.push(setTimeout(function () {
      var c = flower.getBoundingClientRect();
      createBurst(c.left + c.width * 0.28, c.top + c.height * (520/720), 12);
    }, 5700));
    timers.push(setTimeout(function () {
      var c = flower.getBoundingClientRect();
      createBurst(c.left + c.width * 0.72, c.top + c.height * (640/720), 12);
    }, 7000));

    // STEP 3: FLOWER HEAD
    timers.push(setTimeout(function () {
      flower.classList.add('head');
      var c = headCenter();
      createBurst(c.x, c.y, 25);
    }, 8600));

    // STEP 4: PETALS + STAMENS BLOOM
    timers.push(setTimeout(function () {
      flower.classList.add('bloom');
      body.classList.add('bloomed');

      var c = headCenter();
      createBurst(c.x, c.y, 90);
      timers.push(setTimeout(function () { createBurst(c.x + rand(-55, 55), c.y + rand(-30, 45), 50); }, 600));
      timers.push(setTimeout(function () { createBurst(c.x + rand(-85, 85), c.y + rand(-25, 65), 45); }, 1400));
      timers.push(setTimeout(function () { createBurst(c.x + rand(-105, 105), c.y + rand(-15, 85), 35); }, 2300));
      timers.push(setTimeout(function () { createBurst(c.x + rand(-125, 125), c.y + rand(-10, 95), 28); }, 3400));
      timers.push(setTimeout(function () { createBurst(c.x + rand(-140, 140), c.y + rand(-5, 105), 22); }, 4400));

      // golden sparkles when stamens appear
      timers.push(setTimeout(function () { createBurst(c.x, c.y, 30); }, 5200));

      for (var i = 0; i < 40; i++) particles.push(createParticle(true));
    }, 10800));

    // STEP 5: COMPLETE
    timers.push(setTimeout(function () {
      flower.classList.add('full');
    }, 20000));
  }

  document.addEventListener('click', bloom);
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) bloom();
  }, { passive: true });
})();
